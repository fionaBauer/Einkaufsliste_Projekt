<aside class="sidebar">
    <div class="sidebar-inner">
        <div class="sidebar-brand">
            <h2 class="sidebar-title">Prepio</h2>
            <p class="sidebar-subtitle">Planen, kochen, organisieren</p>
        </div>

        <nav class="sidebar-nav">
            <a
                href="{% url 'home' %}"
                class="sidebar-link {% if request.path == '/' %}active{% endif %}">
                Home
            </a>
            <a
                href="{% url 'ingredients:list' %}"
                class="sidebar-link {% if '/ingredients' in request.path %}active{% endif %}">
                Zutaten
            </a>

            <a
                href="{% url 'recipes:recipe_list' %}"
                class="sidebar-link {% if '/recipes' in request.path %}active{% endif %}">
                Rezepte
            </a>

            <a
                href="{% url 'shopping:list' %}"
                class="sidebar-link {% if '/shopping' in request.path %}active{% endif %}">
                Einkaufsliste
            </a>

            <a
                href="{% url 'inventory:list' %}"
                class="sidebar-link {% if '/inventory' in request.path %}active{% endif %}">
                Inventar
            </a>
            
            <a
                href="{% url 'deals:list' %}"
                class="sidebar-link {% if '/deals' in request.path %}active{% endif %}">
                Rabatte
            </a>

            <a
                href="{% url 'meal_plan:planner' %}"
                class="sidebar-link {% if '/meal-plan' in request.path %}active{% endif %}">
                Planung
            </a>
        </nav>
    </div>

    <div class="sidebar-footer">
        <a href="{% url 'households:detail' %}" class="sidebar-household {% if '/households' in request.path %}active{% endif %}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            {{ request.user.households.first.name|default:"Haushalt" }}
        </a>
        <div class="sidebar-user-row">
            <a href="{% url 'user_settings:settings' %}" class="sidebar-settings-link {% if '/settings' in request.path %}active{% endif %}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                Einstellungen
            </a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="sidebar-logout">Abmelden</button>
            </form>
        </div>
    </div>
</aside>
