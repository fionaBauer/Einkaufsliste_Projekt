{% load static %}

<!-- Desktop Sidebar -->
<aside class="sidebar">
    <div class="sidebar-panel">
        <div class="sidebar-inner">
            <div class="sidebar-brand">
                <span class="sidebar-logo" aria-hidden="true">
                    {# Prepio-Logo (Gabel + Teller als "P"), gleiche Form wie global/favicon.svg #}
                    <svg viewBox="194 150 730 730" fill="currentColor">
                        <rect x="262" y="180" width="38" height="170" rx="19"/>
                        <rect x="322" y="180" width="38" height="170" rx="19"/>
                        <rect x="382" y="180" width="38" height="170" rx="19"/>
                        <path d="M262 300 h158 v40 q0 80 -40 100 h-78 q-40 -20 -40 -100 z"/>
                        <rect x="296" y="400" width="90" height="450" rx="45"/>
                        <circle cx="630" cy="420" r="185" fill="none" stroke="currentColor" stroke-width="84"/>
                    </svg>
                </span>
                <div>
                    <h2 class="sidebar-title">Prepio</h2>
                    <p class="sidebar-subtitle">Planen, kochen, organisieren</p>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="{% url 'home' %}" class="sidebar-link {% if request.path == '/' %}active{% endif %}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1.5 1.5 0 01-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 013 20z"/></svg>
                    Home
                </a>
                <a href="{% url 'recipes:recipe_list' %}" class="sidebar-link {% if '/recipes' in request.path %}active{% endif %}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 13.9A5 5 0 017.5 4.1a5 5 0 019 0A5 5 0 0118 13.9V20a1 1 0 01-1 1H7a1 1 0 01-1-1z"/><path d="M6 17h12"/></svg>
                    Rezepte
                </a>
                <a href="{% url 'shopping:list' %}" class="sidebar-link {% if '/shopping' in request.path %}active{% endif %}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 7h14l-1.2 12.1a2 2 0 01-2 1.9H8.2a2 2 0 01-2-1.9z"/><path d="M9 10V6a3 3 0 016 0v4"/></svg>
                    Einkaufsliste
                </a>
                <a href="{% url 'meal_plan:planner' %}" class="sidebar-link {% if '/meal-plan' in request.path %}active{% endif %}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
                    Planung
                </a>
                <a href="{% url 'deals:list' %}" class="sidebar-link {% if '/deals' in request.path %}active{% endif %}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor"/></svg>
                    Rabatte
                </a>
                <a href="{% url 'inventory:list' %}" class="sidebar-link {% if '/inventory' in request.path %}active{% endif %}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 10h16M8 6.5h1M8 13.5h1"/></svg>
                    Inventar
                </a>
                <a href="{% url 'ingredients:list' %}" class="sidebar-link {% if '/ingredients' in request.path %}active{% endif %}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                    Zutaten
                </a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <a href="{% url 'households:detail' %}" class="sidebar-household {% if '/households' in request.path %}active{% endif %}">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M18.5 14.5a6.5 6.5 0 013 5.5"/></svg>
                {{ request.user.households.first.name|default:"Haushalt" }}
            </a>
            <a href="{% url 'user_settings:settings' %}" class="sidebar-settings-link {% if '/settings' in request.path %}active{% endif %}">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                Einstellungen
            </a>
            <form method="post" action="{% url 'logout' %}" data-native>
                {% csrf_token %}
                <button type="submit" class="sidebar-logout">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>
                    Abmelden
                </button>
            </form>
        </div>
    </div>
</aside>
