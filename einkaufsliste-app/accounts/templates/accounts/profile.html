{% extends "base.html" %}
{% load static %}

{% block title %}Profil{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'user_settings/css/settings.css' %}">
{% endblock %}

{% block content %}
<div class="page settings-page">
    <div class="page-header">
        <h1 class="page-title">Profil</h1>
    </div>

    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="settings-form">
        {% csrf_token %}
        <section class="settings-section">
            <div class="settings-card">
                <div class="settings-item">
                    <label class="settings-label" for="profile-username">Benutzername</label>
                    <input type="text" id="profile-username" name="username" value="{{ request.user.username }}">
                </div>
            </div>
        </section>
        <button type="submit" class="btn btn-primary settings-save">Speichern</button>
    </form>
</div>
{% endblock %}
