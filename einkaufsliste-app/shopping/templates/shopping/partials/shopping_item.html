<li class="shopping-item" data-key="item-{{ item.id }}">
    <label class="shopping-row">
        <input
            type="checkbox"
            name="checked_items"
            value="{{ item.id }}"
            class="shopping-check"
            {% if item.is_checked %}checked{% endif %}
        >
        <span class="shopping-content">
            <span class="shopping-main">
                <span class="shopping-name-with-info">
                    <span class="shopping-name">{{ item.ingredient.name }}</span>

                    {% if item.source_details %}
                        <span class="shopping-info-wrapper">
                            <button type="button" class="info-button" aria-label="Verwendung anzeigen" title="Verwendung anzeigen">i</button>
                            <span class="shopping-tooltip">
                                {% for source in item.source_details %}
                                    <span class="shopping-tooltip-line">{{ source.recipe_name }} – {{ source.quantity }} {{ source.unit }}</span>
                                {% endfor %}
                            </span>
                        </span>
                    {% endif %}
                </span>
                {% with deal=item.discount_deals.0 %}
                    {% if deal %}
                        {# Bestes Angebot (günstigster Grundpreis); Tippen öffnet die Seite bzw. App des Händlers #}
                        <a class="shopping-deal" {% if deal.offer_url %}href="{{ deal.offer_url }}" target="_blank" rel="noopener"{% endif %}
                            title="{{ deal.title }}{% if deal.valid_until_label %}, {{ deal.valid_until_label }}{% endif %}">
                            <span class="shopping-deal-tag">Angebot</span>
                            {% if not group_by_store %}{{ deal.store.name }}{% endif %}
                            {% if deal.deal_price %}<strong>{{ deal.deal_price|floatformat:2 }} €</strong>{% endif %}
                            {% if deal.package_size %}<span class="shopping-deal-note">{{ deal.package_size }}</span>{% endif %}
                            {% if deal.requires_loyalty %}<span class="shopping-deal-note">mit App</span>{% endif %}
                        </a>
                    {% endif %}
                {% endwith %}
            </span>
            {# ohne Leerraum, damit :empty greift und ohne Menge kein leerer Kreis erscheint #}
            <span class="shopping-quantity">{% if item.quantity %}{{ item.quantity|floatformat:"-2" }} {{ item.get_unit_display }}{% elif check %}Menge prüfen{% endif %}</span>
        </span>
    </label>
    <button type="submit"
        form="delete-form-{{ item.id }}"
        class="shopping-item-delete-btn"
        aria-label="{{ item.ingredient.name }} entfernen"
        title="Entfernen">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
</li>
